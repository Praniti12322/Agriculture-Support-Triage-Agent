name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        build-args: |
          REACT_APP_API_URL=http://3.110.128.84:8000
        tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        # Force global insecure access
        kubectl config set-cluster microk8s-cluster --insecure-skip-tls-verify=true

    - name: Deploy to K8s
      run: |
        # Replace placeholders in manifests (if any) or just apply
        # We need to replace ${DOCKER_USERNAME} with the actual username
        sed -i "s/\${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g" k8s/*.yaml
        kubectl apply -f k8s/namespace.yaml --insecure-skip-tls-verify --validate=false
        kubectl apply -f k8s/backend.yaml --insecure-skip-tls-verify --validate=false
        kubectl apply -f k8s/frontend.yaml --insecure-skip-tls-verify --validate=false
        kubectl apply -f k8s/portainer.yaml --insecure-skip-tls-verify --validate=false
